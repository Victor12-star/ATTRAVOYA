version: '3.8'

services:
  database:
    image: postgis/postgis:15-3.3-alpine
    container_name: attravoya-postgis
    restart: always
    environment:
      POSTGRES_USER: attravoya_admin
      POSTGRES_PASSWORD: attravoya_secure_password_2026
      POSTGRES_DB: attravoya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - attravoya-network

  cache:
    image: redis:7.2-alpine
    container_name: attravoya-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - attravoya-network

volumes:
  postgres_data:
  redis_data:

networks:
  attravoya-network:
    driver: bridge
